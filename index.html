<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Morgenbriefing</title>
  <meta name="description" content="Das tägliche Morgenbriefing: Politik, Gesundheitspolitik, Medizin, Sport und Finanzen.">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12161d" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f5a8a'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='bold' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,650&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bar">
    <div class="wrap">
      <span class="brand">Morgenbriefing</span>
      <button class="btn" id="prev" type="button" aria-label="Vorherige Ausgabe" disabled>‹</button>
      <select id="pick" aria-label="Ausgabe wählen" disabled><option>Lädt …</option></select>
      <button class="btn" id="next" type="button" aria-label="Nächste Ausgabe" disabled>›</button>
    </div>
  </div>

  <main>
    <div class="wrap" id="view">
      <div class="note">
        <h2>Ausgabe wird geladen</h2>
        <p>Hier erscheint jeden Morgen das neue Briefing. Ältere Ausgaben findest du oben in der Datumsauswahl.</p>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
